<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="language" content="en" />
		<!-- Theme -->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="msvalidate.01" content="5413314A97979577FC96423368AD9955" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin="anonymous" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
		%sveltekit.head%
		<script>
			// Get user's explicit preference
			const userTheme = localStorage.getItem('theme');

			// Get system preference
			const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

			// Use user preference if set, otherwise follow system
			const theme = userTheme || (systemTheme.matches ? 'dark' : 'light');

			// Apply theme
			document.documentElement.classList.toggle('dark', theme === 'dark');

			// Listen for system changes
			systemTheme.addEventListener('change', (e) => {
				// Only follow system if user hasn't set preference
				if (!localStorage.getItem('theme')) {
					document.documentElement.classList.toggle('dark', e.matches);
				}
			});
		</script>

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-H0MZ3PE3G8"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-H0MZ3PE3G8');
		</script>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-white text-black dark:bg-gray-900 dark:text-white"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
